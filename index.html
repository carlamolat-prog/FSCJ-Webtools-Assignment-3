<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Linkage to CSS -->
    
    <link rel="stylesheet" href="style.css">

    <!-- Linkage to JavaScript Page -->
    
    <script src="script.js" defer></script>
  </head>
  <body>
    
    <!-- Header With Image and Start Button -->
    
    <div id="quiz-intro">
     <img id="start-image" src="https://margaritavillestore.com/cdn/shop/files/mgv-a1a-tin-sign.png?v=1761253104&width=3840" style="max-width: 100%; height: auto;" alt="Start Image"> 
     <h1>Welcome to the Assignment 3 Quiz!</h1>
     <button id="start-btn">Start Quiz</button>
    </div>
    
    <!-- Quiz Questions in JS -->
    
    <div id="quiz-container" style="display:none;">
      <div id="question"></div>

      <div id="choices"></div>

      <button id="next-btn" style="display:none;"></button>
    </div>
    
    <!-- Results Screen, Initially Hidden -->
    
    <div id="results" style="display:none;">
      <h2>Your Score Is:</h2>
      <p id="score-text"></p>
      <button id="restart-btn">Restart Quiz</button>
    </div>

    <script="script.js"></script>
  </body>
  <footer>
    <p>Contact: <a href="s2091636@fscj.edu">Carl Amolat </a></p>
    <p>&copy October 2026</p>
  </footer>
</html>
